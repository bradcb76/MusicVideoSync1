{% extends "base.html" %}{% block content %}
<section class="panel"><div class="toolbar"><label class="search-box">Search tracks<input id="track-search" type="search" placeholder="Artist, album, or song"></label>
<label>Sort<select id="track-sort"><option value="artist">Artist</option><option value="album">Album</option><option value="title">Title</option></select></label>
<button class="button primary" data-action="scan">Scan music library</button></div>
<div class="table-wrap"><table><thead><tr><th>Artist</th><th>Album</th><th>Track</th><th>Duration</th><th>Status</th></tr></thead><tbody id="track-table"></tbody></table></div>
<div class="pagination"><button class="button ghost" id="tracks-prev">Previous</button><span id="tracks-page">Page 1</span><button class="button ghost" id="tracks-next">Next</button></div></section>
{% endblock %}
