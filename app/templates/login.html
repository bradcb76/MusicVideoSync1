<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · MusicVideoSync</title><link rel="stylesheet" href="/static/app.css"></head>
<body class="auth-page"><main class="auth-card">
  <div class="brand-mark large">M</div><p class="eyebrow">Private media automation</p><h1>Welcome back</h1>
  <p class="muted">Sign in to manage your library and integrations.</p>
  <form id="login-form"><label for="password">Administrator password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button class="button primary wide" type="submit">Sign in</button><p id="login-error" class="error" role="alert"></p>
  </form>
</main><script src="/static/login.js" defer></script></body></html>
